spring:
  datasource:
    url: jdbc:h2:mem:handwash-tests;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - metrics
  endpoint:
    health:
      show-details: never
