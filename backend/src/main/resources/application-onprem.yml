# On-premises (Windows PC with Docker): the cloud profile without AWS.
# ADMIN signs in with a local account (password + TOTP); operators and the YOLO PC use API keys.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Never contacted: external JWTs are rejected locally (OnPremSecurityConfig).
          issuer-uri: https://onprem.invalid

handwash:
  security:
    cognito-client-id: onprem-disabled-user
    cognito-producer-client-id: onprem-disabled-producer
  audit:
    # The daily seals go to a folder (mounted volume); see CloudProfileSafetyGuard for the rules.
    seal-dir: ${HANDWASH_AUDIT_SEAL_DIR}
  admin:
    # Base64 of 32 random bytes (encrypts the TOTP secrets at rest). Generated by the installer, never committed.
    totp-key: ${HANDWASH_ADMIN_TOTP_KEY}
    # One-time: the installer creates the first ADMIN and removes the password from the environment file afterwards.
    bootstrap-username: ${HANDWASH_BOOTSTRAP_ADMIN_USERNAME:}
    bootstrap-password: ${HANDWASH_BOOTSTRAP_ADMIN_PASSWORD:}
