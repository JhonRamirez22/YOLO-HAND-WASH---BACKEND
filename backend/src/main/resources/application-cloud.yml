server:
  address: 0.0.0.0
  # The client address comes from the trusted hop in ClientAddress, not from the first X-Forwarded-For entry.
  forward-headers-strategy: none

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${HANDWASH_DB_URL}
    username: ${HANDWASH_DB_USERNAME}
    password: ${HANDWASH_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${HANDWASH_DB_POOL_MAX:8}
      minimum-idle: ${HANDWASH_DB_POOL_MIN_IDLE:1}
      connection-timeout: 2500
      validation-timeout: 1000
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: ${HANDWASH_MIGRATION_DB_URL}
    user: ${HANDWASH_MIGRATION_DB_USERNAME}
    password: ${HANDWASH_MIGRATION_DB_PASSWORD}
    clean-disabled: true
    validate-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - metrics
  endpoint:
    health:
      show-details: never

handwash:
  deployment:
    mode: NON_CLINICAL_DEMO
  security:
    cognito-client-id: ${COGNITO_CLIENT_ID}
    cognito-producer-client-id: ${COGNITO_PRODUCER_CLIENT_ID}
    # Optional second pool for operators (no MFA). Empty keeps the single-pool behaviour.
    operator-issuer-uri: ${OPERATOR_ISSUER_URI:}
    operator-client-id: ${OPERATOR_CLIENT_ID:}
    operator-user-pool-id: ${OPERATOR_USER_POOL_ID:}
    producer-jwt-enabled: true
  producer:
    require-v2: true
  validation:
    # V2 is the cloud default; set false only to roll back before the V2 kiosk is published.
    balanced-friction-enabled: ${HANDWASH_BALANCED_FRICTION_ENABLED:true}
  recognition:
    # Shadow-only comparison of the temporal decoder against the producer cascade.
    sequence-decoder-shadow-enabled: ${HANDWASH_SEQUENCE_DECODER_SHADOW_ENABLED:true}
  session:
    access-token-ttl-ms: ${HANDWASH_SESSION_TOKEN_TTL_MS:3600000}
  cors:
    allowed-origins: ${HANDWASH_CORS_ALLOWED_ORIGINS}
  audit:
    model-version: ${HANDWASH_MODEL_VERSION}
    model-sha256: ${HANDWASH_MODEL_SHA256}
    dataset-version: ${HANDWASH_DATASET_VERSION}
    # Secret outside the database: without it the hash chain cannot be recomputed or forged.
    chain-secret: ${HANDWASH_AUDIT_CHAIN_SECRET}
    # Object Lock bucket for the daily seals; blank keeps seals in the database only.
    seal-bucket: ${HANDWASH_AUDIT_SEAL_BUCKET:}
    seal-kms-key-id: ${HANDWASH_AUDIT_SEAL_KMS_KEY_ID:}
    seal-region: ${AWS_REGION:sa-east-1}
  oms:
    model-ready: false
    input-enabled: false
  evidence:
    # Deployment switch. The runtime kill switch in the database also has to be on, and capture
    # needs a bucket and a KMS key; without them the guard refuses to start with capture enabled.
    capture-enabled: ${HANDWASH_EVIDENCE_CAPTURE_ENABLED:false}
    bucket: ${HANDWASH_EVIDENCE_BUCKET:}
    kms-key-id: ${HANDWASH_EVIDENCE_KMS_KEY_ID:}
    retention-days: ${HANDWASH_EVIDENCE_RETENTION_DAYS:30}
    region: ${AWS_REGION:sa-east-1}
  video:
    remote-enabled: false
  inference:
    api-enabled: false
